name: Android CI

on:
  pull_request:
    paths:
      - 'MiracastReceiver/**'
      - '.github/workflows/android-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'MiracastReceiver/**'
      - '.github/workflows/android-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MiracastReceiver

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Validate WebUI JavaScript
        run: node --check app/src/main/assets/webui/app.js

      - name: Validate Android TV branding resources
        run: |
          grep -q 'android:icon="@mipmap/ic_launcher"' app/src/main/AndroidManifest.xml
          grep -q 'android:banner="@drawable/tv_banner"' app/src/main/AndroidManifest.xml
          ! grep -q 'android:roundIcon=' app/src/main/AndroidManifest.xml
          grep -q 'android:width="160dp"' app/src/main/res/drawable/tv_banner.xml
          grep -q 'android:height="90dp"' app/src/main/res/drawable/tv_banner.xml
          grep -q '<adaptive-icon' app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MiracastReceiver-debug-${{ github.sha }}
          path: MiracastReceiver/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
