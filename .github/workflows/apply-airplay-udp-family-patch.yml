name: Apply AirPlay UDP family patch

on:
  push:
    branches:
      - fix/airplay-udp-address-family
    paths:
      - scripts/apply_airplay_udp_family_patch.py
      - .github/workflows/apply-airplay-udp-family-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/airplay-udp-address-family
          fetch-depth: 0
      - name: Apply exact source patch
        run: python3 scripts/apply_airplay_udp_family_patch.py
      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: bind AirPlay UDP to RTSP peer family"
          git push origin HEAD:fix/airplay-udp-address-family
