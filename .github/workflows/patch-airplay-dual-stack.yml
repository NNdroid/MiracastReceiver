name: Patch AirPlay dual-stack listeners

on:
  push:
    branches: [fix/airplay-dual-stack]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch fixed and event TCP listeners
        shell: python
        run: |
          from pathlib import Path
          import re

          rtsp = Path('MiracastReceiver/app/src/main/java/com/weekd/miracastreceiver/airplay/RtspHandler.kt')
          text = rtsp.read_text(encoding='utf-8-sig')
          if 'import com.weekd.miracastreceiver.utils.PortUtils' not in text:
              text = text.replace('import com.weekd.miracastreceiver.util.Logger\n', 'import com.weekd.miracastreceiver.util.Logger\nimport com.weekd.miracastreceiver.utils.PortUtils\n')
          if 'return PortUtils.bindFixedServerSocket(RTSP_PORT)' not in text:
              text, count = re.subn(
                  r'return\s+ServerSocket\(\)\.apply\s*\{\s*reuseAddress\s*=\s*true\s*bind\(java\.net\.InetSocketAddress\(RTSP_PORT\)\)\s*\}',
                  'return PortUtils.bindFixedServerSocket(RTSP_PORT)',
                  text,
                  count=1,
                  flags=re.S,
              )
              if count != 1:
                  raise SystemExit(f'RTSP bind replacement count={count}')
          rtsp.write_text(text, encoding='utf-8')

          receiver = Path('MiracastReceiver/app/src/main/java/com/weekd/miracastreceiver/airplay/AirPlayReceiver.kt')
          text = receiver.read_text(encoding='utf-8-sig')
          if 'import com.weekd.miracastreceiver.utils.PortUtils' not in text:
              text = text.replace('import com.weekd.miracastreceiver.util.Logger\n', 'import com.weekd.miracastreceiver.util.Logger\nimport com.weekd.miracastreceiver.utils.PortUtils\n')
          if 'val event = PortUtils.bindEphemeralServerSocket()' not in text:
              text, count = re.subn(r'val\s+event\s*=\s*ServerSocket\(0\)', 'val event = PortUtils.bindEphemeralServerSocket()', text, count=1)
              if count != 1:
                  raise SystemExit(f'AirPlay event replacement count={count}')
          receiver.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/patch-airplay-dual-stack.yml')
          workflow.unlink()
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: make AirPlay RTSP and event listeners dual-stack"
          git push origin HEAD:fix/airplay-dual-stack
